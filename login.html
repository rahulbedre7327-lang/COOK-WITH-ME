<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
                }
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .login-form{
        width: 380px;
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      .login-form h1{
        text-align: center;
        margin-bottom: 30px;
        color: #333;
      }
      .input-group{
        margin-bottom: 20px;
      }
      .input-group label{
        display: block;
        margin-bottom: 8px;
      }
      .input-group input{
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
      }
      .input-group input:focus{
        border-color: orange;
        outline: none;
        box-shadow: 0 0 8px rgba(255, 165, 0, 0.4);
      }
      .options{
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        font-size: 14px;
      }
      .options a{
        text-decoration: none;
        color: orange;
      }
      .login-form button{
        width: 100%;
        padding: 14px;
        background: orange;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        transition: .3s;
      }
      .login-form button:hover{
        background: darkorange;
        transform: scale(1.03);
      }
      .login-form p{
        text-align: center;
        margin-top: 20px;
      }
      .login-form p a{
        color: orange;
        text-decoration: none;
      }
      /* =====================
   Dark Mode
===================== */

body.dark-mode{
    background:#121212;
    color:white;
}

body.dark-mode .navbar{
    background:#000;
}

body.dark-mode .hero,
body.dark-mode .card,
body.dark-mode .recipe-card,
body.dark-mode .favorite-card,
body.dark-mode .history-card,
body.dark-mode .settings-card{
    background:#1f1f1f;
    color:white;
}

body.dark-mode p{
    color:#ddd;
}

body.dark-mode h1,
body.dark-mode h2,
body.dark-mode h3{
    color:#ff9800;
}

body.dark-mode .footer{
    background:#000;
}
    </style>
  </head>
  <body>
    <div class="login-container">
      <form class="login-form">
        <h1>Welcome Back</h1>
        <div class="input-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Enter Username" />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" />
        </div>
        <div class="options">
          <label>
            <input type="checkbox" />
            Remember Me
          </label>
          <a href="#">Forgot Password</a>
        </div>
        <button onclick="login()" type="submit">Login</button>
        <p id="message" >
          Don't have an account?
          <a href="#">Sign Up</a>
        </p>
      </form>
    </div>
    <script>
        function login(){

    let username = document.getElementById("username").value;

    let password = document.getElementById("password").value;

    let message = document.getElementById("message");

    if(username === "" || password === ""){

        message.innerHTML = "Please fill all fields.";

        message.style.color = "red";

        return;
    }

    if(username === "rahul" && password === "12345"){

       window.location.href = "dashboard.html";

        message.style.color = "green";

    }else{

        message.innerHTML = "Invalid Username or Password";

        message.style.color = "red";

    }

}
    </script>
    <script src="../script/theme.js"></script>
    <!-- Customized Food Floating Button -->
<a href="custom-food.html" class="custom-food-button" aria-label="Cook with what you have">

    <div class="cooker-image">
        <img src="images/custom-food.png" alt="Customized Food Cooker">
    </div>

    <div class="cook-label">
        <span>Cook With</span>
        <strong>What You Have</strong>
    </div>

</a>
  </body>
</html>
