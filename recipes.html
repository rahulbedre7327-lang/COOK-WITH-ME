<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
</head>
<style>
    /* ==========================
   Global Styles
========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f5f5;
    color:#333;
}

/* ==========================
   Header
========================== */

header{
    background:#222;
    color:white;
    text-align:center;
    padding:25px;
}

header h1{
    font-size:38px;
    color:orange;
}

header p{
    margin-top:10px;
    color:#ddd;
}

/* ==========================
   Recipe Section
========================== */

.recipe-container{
    width:90%;
    max-width:1000px;
    margin:40px auto;
}

.recipe-card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    transition:0.3s;
}

.recipe-card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.recipe-card h2{
    color:#222;
    margin-bottom:10px;
}

.recipe-card p{
    color:#666;
    margin-bottom:10px;
}

.recipe-card button{
    background:orange;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

.recipe-card button:hover{
    background:darkorange;
}

/* ==========================
   Back Button
========================== */

.back-btn{
    display:inline-block;
    margin:30px auto;
    background:#222;
    color:white;
    text-decoration:none;
    padding:12px 25px;
    border-radius:8px;
    transition:0.3s;
}

.back-btn:hover{
    background:orange;
}

/* ==========================
   Responsive
========================== */

@media(max-width:768px){

    .recipe-container{
        width:95%;
    }

    header h1{
        font-size:30px;
    }

}
/* =====================
   Dark Mode
===================== */

body.dark-mode{
    background:#121212;
    color:white;
}

body.dark-mode .navbar{
    background:#000;
}

body.dark-mode .hero,
body.dark-mode .card,
body.dark-mode .recipe-card,
body.dark-mode .favorite-card,
body.dark-mode .history-card,
body.dark-mode .settings-card{
    background:#1f1f1f;
    color:white;
}

body.dark-mode p{
    color:#ddd;
}

body.dark-mode h1,
body.dark-mode h2,
body.dark-mode h3{
    color:#ff9800;
}

body.dark-mode .footer{
    background:#000;
}
.logo{
    display:flex;
    align-items:center;
    gap:15px;
    text-decoration:none;
}

.logo img{
    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
    transition:.3s;
}

.logo img:hover{
    transform:rotate(10deg) scale(1.08);
}

.logo span{
    font-size:30px;
    font-weight:bold;
    color:#ff9800;
    letter-spacing:1px;
}
</style>
<body>

<header>
  <div class="logo">
    <img src="images/logo.png" alt="Cook With Me Logo">
    <span>Cook With Me</span>
</div>
    <p>Browse all delicious recipes.</p>
</header>

<div class="recipe-container">

    <div class="recipe-card">
        <h2>Chicken Biryani</h2>
        <p>⭐⭐⭐⭐⭐ | ⏱ 45 Minutes</p>
        <button>View Recipe</button>
    </div>

    <div class="recipe-card">
        <h2>Masala Dosa</h2>
        <p>⭐⭐⭐⭐⭐ | ⏱ 30 Minutes</p>
        <button>View Recipe</button>
    </div>

    <div class="recipe-card">
        <h2>Paneer Butter Masala</h2>
        <p>⭐⭐⭐⭐ | ⏱ 35 Minutes</p>
        <button>View Recipe</button>
    </div>

    <div class="recipe-card">
        <h2>Veg Fried Rice</h2>
        <p>⭐⭐⭐⭐ | ⏱ 25 Minutes</p>
        <button>View Recipe</button>
    </div>

    <a href="dashboard.html" class="back-btn">⬅ Back to Dashboard</a>

</div>
<script src="../script/theme.js"></script>
<!-- Customized Food Floating Button -->
<a href="custom-food.html" class="custom-food-button" aria-label="Cook with what you have">

    <div class="cooker-image">
        <img src="images/custom-food.png" alt="Customized Food Cooker">
    </div>

    <div class="cook-label">
        <span>Cook With</span>
        <strong>What You Have</strong>
    </div>

</a>
</body>
</html>
