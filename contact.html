<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
   <style>
    *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:90%;
max-width:700px;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:orange;
margin-bottom:15px;
}

p{
text-align:center;
margin-bottom:20px;
}

.contact-box p{
text-align:left;
margin:15px 0;
font-size:18px;
}

.contact-box i{
color:orange;
margin-right:10px;
}

input,
textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:orange;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:darkorange;
}

.back-btn{
display:inline-block;
margin-top:25px;
text-decoration:none;
background:#222;
color:white;
padding:12px 20px;
border-radius:8px;
}

.back-btn:hover{
background:orange;
}

body.dark-mode{
background:#121212;
}

body.dark-mode .container{
background:#1f1f1f;
color:white;
}

body.dark-mode input,
body.dark-mode textarea{
background:#2b2b2b;
color:white;
border:none;
}
.success p{
    color:green;
    display:none; 
}
   </style>
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<div class="container">

    <h1>📞 Contact Us</h1>

    <p>We'd love to hear from you!</p>

    <div class="contact-box">

        <p><i class="fas fa-envelope"></i> rahulbedre253@gmail.com</p>

        <p><i class="fas fa-phone"></i> +91 8147107648</p>

        <p><i class="fas fa-map-marker-alt"></i> Hanagal, Karnataka</p>

    </div>

    <form>

        <input type="text" placeholder="Your Name" required>

        <input type="email" placeholder="Your Email" required>

        <textarea placeholder="Your Message" rows="6"></textarea>
        <p id="success">
    ✅ Thank you! Your message has been received.
</p>


       <button type="button" onclick="sendMessage()">
    Send Message
</button>

    </form>

    <a href="dashboard.html" class="back-btn">⬅ Back to Dashboard</a>

</div>
<script>
function sendMessage() {
    document.getElementById("success").style.display = "block";
}
</script>
<script src="../script/theme.js"></script>
<!-- Customized Food Floating Button -->
<a href="custom-food.html"
   class="custom-food-float"
   title="Cook With What You Have">

    <img src="images/custom-food.png"
         alt="Customized Food">

    <span>Cook With<br>What You Have</span>
</a>
</body>
</html>
