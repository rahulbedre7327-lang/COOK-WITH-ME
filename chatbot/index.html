<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TastyMe Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Chat Launcher -->
<button
    class="chat-launcher"
    id="chatLauncher"
    type="button"
    aria-label="Open TastyMe chatbot">

    🤖

</button>
    <section class="chatbot" id="chatbot" aria-label="CookWithMe cooking assistant">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="chat-header">

            <div class="brand">

                <div class="brand-icon">
                    <img src="../images/custom-food.png" alt="CookWithMe">
                </div>

                <div class="brand-info">

                    <h2>TastyMe</h2>

                    <div class="online">
                        <span class="online-dot"></span>
                        Online • Cooking Assistant
                    </div>

                </div>

            </div>


            <div class="header-actions">

                <button class="icon-button" id="clearChat" type="button" title="Clear chat" aria-label="Clear chat">

                    ↻

                </button>

                <button class="icon-button" id="closeChat" type="button" title="Close" aria-label="Close chatbot">

                    ✕

                </button>

            </div>

        </header>


        <!-- =========================
             MESSAGES
        ========================== -->

        <main class="chat-body" id="chatBody" aria-live="polite">

        </main>


        <!-- =========================
             QUICK ACTIONS
        ========================== -->

        <div class="quick-actions">

            <button class="quick-button" data-action="find" type="button">

                🥘 Find Recipe

            </button>


            <button class="quick-button" data-action="ingredients" type="button">

                🧂 My Ingredients

            </button>


            <button class="quick-button" data-action="help" type="button">

                📖 Cooking Help

            </button>

        </div>


        <!-- =========================
             INPUT
        ========================== -->

        <footer class="input-area">

            <div class="input-wrapper">


                <!-- MICROPHONE IMAGE -->

                <button class="input-button voice-button" id="voiceButton" type="button" title="Voice input"
                    aria-label="Voice input">

                    <img src="../images/microphone.png" alt="Microphone">

                </button>


                <!-- MESSAGE INPUT -->

                <input id="messageInput" type="text" autocomplete="off" placeholder="Type your ingredients...">


                <!-- SEND -->

                <button class="input-button send-button" id="sendButton" type="button" aria-label="Send message">

                    ➤

                </button>

            </div>


            <div class="input-hint">

                Try: "I have rice, tomato, onion and egg"

            </div>

        </footer>

    </section>



    <script src="script.js"></script>
</body>

</html>
